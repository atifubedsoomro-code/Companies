<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Explorer Pro · Team Terminators</title>
<style>
:root{
  --bg:#f4f5fa;--panel:#fff;--panel2:#f8f9fd;--ink:#13162b;--muted:#6a7090;--line:#e4e7f2;--line2:#d5d9ea;
  --accent:#4f46e5;--accent2:#0ea5e9;--accent-soft:#eceafe;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;
  --shadow:0 1px 2px rgba(20,24,60,.04),0 8px 24px rgba(20,24,60,.06);--shadow-lg:0 20px 60px rgba(15,18,50,.28);
  --side:#0e1126;--side-ink:#aab0d4;--side-hi:#fff;--r:14px;
  --font:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
[data-theme=dark]{
  --bg:#0b0d1a;--panel:#141830;--panel2:#1a1f3a;--ink:#e9ebfa;--muted:#8f96bd;--line:#252a4b;--line2:#31375f;
  --accent:#8b83ff;--accent2:#38bdf8;--accent-soft:#25244d;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  --side:#080a17;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.hidden{display:none!important}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg);z-index:100}
.lg-art{position:relative;overflow:hidden;color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(900px 500px at 10% 0%,#5b50f0 0%,transparent 60%),radial-gradient(700px 600px at 100% 100%,#0ea5e9 0%,transparent 55%),#0e1126}
.lg-art:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at 30% 40%,#000,transparent 75%)}
.lg-art>*{position:relative}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.2px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#6d63ff,#22d3ee);display:grid;place-items:center;box-shadow:0 8px 20px rgba(80,70,229,.45)}
.logo svg{stroke:#fff;width:22px;height:22px}
.lg-art h1{font-size:clamp(30px,3.6vw,48px);line-height:1.08;margin:0 0 16px;letter-spacing:-1.2px;font-weight:750}
.lg-art p{max-width:460px;color:#cfd4ff;font-size:16px;margin:0}
.lg-stats{display:flex;gap:28px;flex-wrap:wrap}
.lg-stats b{display:block;font-size:28px;letter-spacing:-.8px}.lg-stats span{font-size:12px;color:#aab2ff;text-transform:uppercase;letter-spacing:1.2px}
.lg-form{display:grid;place-items:center;padding:32px}
.lg-card{width:min(420px,100%)}
.lg-card h2{font-size:28px;margin:0 0 6px;letter-spacing:-.6px}
.lg-card .sub{color:var(--muted);margin:0 0 26px}
.pw{position:relative;margin-bottom:14px}
.pw input{width:100%;height:50px;border-radius:12px;border:1.5px solid var(--line2);background:var(--panel);padding:0 48px 0 44px;font-size:15px;outline:none;transition:.15s}
.pw input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
